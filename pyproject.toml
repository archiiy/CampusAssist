[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-assistant"
version = "0.1.0"
description = "Agentic AI college helpdesk (router -> RAG desk agents -> reflection -> governance)"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
