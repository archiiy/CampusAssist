# CampusAssist theme — single dark theme only (no light variant).
# Single source of truth for Streamlit's native widget colors (buttons,
# chat input, Deploy menu, sidebar toggle, container borders). Matches the
# token values in app.py's CUSTOM_CSS exactly.

[theme]
base = "dark"
primaryColor = "#7FB2E0"
backgroundColor = "#11161D"
secondaryBackgroundColor = "#1A212B"
textColor = "#E7EBF0"
borderColor = "#687489"
linkColor = "#7FB2E0"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Lora:https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap"
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
showWidgetBorder = true
showSidebarBorder = true
